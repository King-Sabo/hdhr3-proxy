# Shared settings for run.sh / check.sh / the systemd unit.

# Device ID from: hdhomerun_config discover   (FFFFFFFF = first one found)
DEVICE=1220EEF8

# eu-cable = DVB-C (cable)   |   eu-bcast = DVB-T (antenna)
# Leave empty to skip setting it; tuning uses explicit frequencies anyway.
SOURCE=eu-cable

# HTTP port Plex connects to
PORT=5004

# Where muxes.json, services.json, epg-cache.json and guide.xml are kept
DATA_DIR=/var/lib/hdhr3-proxy

# Everything else goes here. Run with --check to see the effect before
# committing to a grab. Common ones:
#   --channels 1-49        keep only these channel numbers
#   --exclude QVC          drop channels by name (repeatable)
#   --no-shopping          drop channels the EIT marks as shopping
#   --epg-days 2           how far ahead to publish
#   --epg-dwell 120        seconds per multiplex
OPTIONS="--epg-days 2 --epg-dwell 120"

# On a Raspberry Pi, DATA_DIR on the SD card means the guide and cache are
# rewritten there repeatedly. A USB stick or SSD avoids that wear entirely:
#   DATA_DIR=/mnt/usb/hdhr3-proxy
# run.sh already keeps the throwaway multiplex captures in RAM (/dev/shm).
# --write-interval 600 cuts the rewrite frequency further if you stay on SD.
